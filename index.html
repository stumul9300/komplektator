<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Комплектатор</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: рабочее приложение. Шапка с переключателем ролей, вкладки, основная колонка + боковая карточка позиции. */
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --sunk:#E4E8E2; --line:#D3D9D1;
  --fg:#1C2420; --muted:#66706A; --accent:#2F5D50; --accent-fg:#FFFFFF; --brass:#9C7A33;
  --s-pick:#7A6FB0; --s-des:#C27C2C; --s-cli:#2C7BB0; --s-ok:#2F8A55; --s-ord:#5A6B66; --s-del:#1F4D3F; --s-bad:#B5463C;
  --f-display:"Prata",Georgia,"Times New Roman",serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1C2320; --sunk:#232B28; --line:#323C38;
  --fg:#E6EBE7; --muted:#97A39C; --accent:#7FBFA9; --accent-fg:#0F1A16; --brass:#D2AE62;
  --s-pick:#A99FE0; --s-des:#E3A35C; --s-cli:#6FB3E0; --s-ok:#6CC892; --s-ord:#9AAAA4; --s-del:#8FD1BA; --s-bad:#E57F74;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1C2320; --sunk:#232B28; --line:#323C38;
  --fg:#E6EBE7; --muted:#97A39C; --accent:#7FBFA9; --accent-fg:#0F1A16; --brass:#D2AE62;
  --s-pick:#A99FE0; --s-des:#E3A35C; --s-cli:#6FB3E0; --s-ok:#6CC892; --s-ord:#9AAAA4; --s-del:#8FD1BA; --s-bad:#E57F74;
  color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-block:16px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0;line-height:1.2;text-wrap:balance}
.roles{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.roles span{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
.count{font-family:var(--f-mono);font-size:11px;background:var(--brass);color:var(--surface);border-radius:999px;padding:1px 7px}
main{padding-block:24px 48px}
.note{font-size:13px;color:var(--muted);margin:0 0 20px}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 12px}
h3{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.money{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.big{font-family:var(--f-display);font-size:30px;line-height:1.1}
.big small{font-family:var(--f-body);font-size:14px;color:var(--muted)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk);margin:12px 0 10px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .m{font-size:13px;color:var(--muted)}
.sw{width:38px;height:38px;border-radius:8px;flex:none;border:1px solid var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.bad{color:var(--s-bad)}
.btn.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:820px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sunk)}
td.num,th.num{text-align:right}
.sku{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
tfoot td{font-weight:600;border-bottom:0}
.supitem{display:grid;grid-template-columns:120px 1fr;gap:16px;margin-bottom:14px}
.supitem .ph{width:120px;height:120px;border-radius:10px;background:var(--sunk) center/cover no-repeat}
.supitem h3{margin:0 0 4px;text-transform:none;letter-spacing:0;font-size:16px;color:var(--ink)}
.supitem .add{margin:10px 0 0}
.ansbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px}
.ansbox .who{font-weight:600}
.reqlink{display:flex;gap:6px;align-items:center;margin-top:6px}.reqlink input{flex:1;min-width:0;font-family:var(--f-mono);font-size:12px}
@media (max-width:640px){.supitem{grid-template-columns:1fr}.supitem .ph{width:100%;height:200px}}
tr.sechead td{background:var(--sunk);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:13px;cursor:default}
tr.roomhead td{font-size:13px;color:var(--muted);font-weight:600;padding-top:8px;padding-bottom:6px;cursor:default}
tr.sectot td{font-weight:600;cursor:default}
tr.sechead:hover td,tr.roomhead:hover td,tr.sectot:hover td{background:inherit}
.no{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-right:6px}
.empty{padding:20px;color:var(--muted);text-align:center}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,12,.4);z-index:20}
aside.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;border-left:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{display:flex;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line);align-items:flex-start}
.dh .sw{width:64px;height:64px}
.dh h2{font-size:20px;margin:0 0 4px}
.close{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;color:var(--muted);padding:4px}
.db{padding:18px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px}
dt{color:var(--muted)}
dd{margin:0;min-width:0;overflow-wrap:anywhere}
.flow{display:flex;flex-wrap:wrap;gap:4px;font-size:12px}
.flow span{padding:3px 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.flow span.on{background:var(--accent);color:var(--accent-fg)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.wait{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:10px 12px}
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{background:var(--sunk);border-radius:10px;padding:9px 12px;font-size:14px}
.msg .who{font-size:12px;font-weight:600;margin-bottom:2px}
.msg .who time{font-weight:400;color:var(--muted);margin-left:6px}
.compose{display:flex;gap:8px}
.compose input,.field input,.field select{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
form.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.check:has(input:disabled){color:var(--muted)}
.vars{display:flex;flex-direction:column;gap:8px}
.var{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;width:100%}
.var .grow{flex:1;min-width:0;display:flex;flex-direction:column}
.var .t{font-weight:500}.var .m{font-size:13px;color:var(--muted)}
.var .mark{font-size:12px;font-weight:600;color:var(--accent);white-space:nowrap}
.var[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.var:disabled{cursor:default}
.cl{display:flex;flex-direction:column;gap:6px}
.cl .done{text-decoration:line-through;color:var(--muted)}
.projset{margin-bottom:16px}
.projset summary{cursor:pointer;font-weight:600}
table.vis th,table.vis td{text-align:center}table.vis th:first-child,table.vis td:first-child{text-align:left}
table.vis tbody tr{cursor:default}table.vis input{width:18px;height:18px;accent-color:var(--accent)}
.note.warn{color:var(--s-des)}
.varwrap{display:flex;flex-direction:column;gap:4px}
.vlink,.db a{color:var(--accent);font-size:13px}
.empty-state{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-top:16px}
.sw{background-size:cover;background-position:center;background-repeat:no-repeat}
.photo{width:100%;max-height:280px;object-fit:contain;border-radius:10px;background:var(--sunk);display:block}
.imgprev{width:64px;height:64px;border-radius:8px;border:1px dashed var(--line);background:var(--sunk) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);text-align:center}
.imgrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.swup{position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.swup input{position:absolute;inset:0;opacity:0;cursor:pointer}
.swplus{font-size:12px;line-height:1.2;text-align:center;color:var(--fg);opacity:.75;pointer-events:none}
.swhint{position:absolute;inset:auto 0 0 0;font-size:10px;text-align:center;background:rgba(0,0,0,.45);color:#fff;padding:2px 0;opacity:0;transition:opacity .15s;pointer-events:none}
.swup:hover .swhint,.swup:focus-within .swhint{opacity:1}
.swup:hover{outline:2px solid var(--accent);outline-offset:1px}
.vizcard{margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.vizhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.vizimg{position:relative;border-radius:10px;overflow:hidden;background:var(--sunk);user-select:none}
.vizimg img{display:block;width:100%;height:auto}
.vizimg.picking{cursor:crosshair;outline:2px dashed var(--accent);outline-offset:2px}
.pin{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.35);padding:0}
.pin:hover{transform:translate(-50%,-50%) scale(1.15)}
.pin.pending{background:var(--brass);pointer-events:none}
.pin.static{position:static;transform:none;flex:none;box-shadow:none}
.pinpick{display:flex;gap:8px;flex-wrap:wrap}.pinpick select{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.roomsel{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;max-width:100%}
td .roomsel{background:transparent}
.stage{position:relative;width:100%;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background-color:var(--sunk);touch-action:none;user-select:none}
.stagehint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;padding:16px;text-align:center}
.layer{position:absolute;cursor:pointer}
.stage.editable .layer{cursor:move}
.layer img{display:block;width:100%;height:auto;pointer-events:none}
.layer.cut img{filter:drop-shadow(0 10px 12px rgba(0,0,0,.35)) drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.cutstat{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.65);color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none}
.layer.sel{outline:2px dashed var(--accent);outline-offset:2px}
.grip{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid #fff;cursor:nwse-resize;mix-blend-mode:normal}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.pick{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px;flex-wrap:wrap}
.pick.on{border-color:var(--accent)}
.pick .sw{width:32px;height:32px}.pick .pn{flex:1;min-width:0;overflow-wrap:anywhere}
.qtybox{border:1px solid var(--line);border-radius:10px;padding:12px}
.calc{margin:10px 0 0;font-size:15px}
.rowsel{width:18px;height:18px;margin:0 0 6px;accent-color:var(--accent);display:block}
.tri{display:flex;flex-wrap:wrap;gap:4px}.tri.sm{flex-wrap:nowrap;flex-shrink:0}.tri.sm .tb{padding-right:6px}
.tb{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.tb b{font-weight:700}
.tb.g{color:var(--s-ok)}.tb.w{color:var(--s-des)}.tb.r{color:var(--s-bad)}.tb.n{color:var(--muted);opacity:.7}
.alert{border:1px solid var(--s-bad);color:var(--fg);background:var(--sunk);border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filebtn{position:relative;overflow:hidden}.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.timeline .row .date{font-family:var(--f-mono);font-size:13px;width:92px;flex:none}
@media (max-width:560px){.brand h1{font-size:20px}.big{font-size:26px}}
@media (prefers-reduced-motion:no-preference){aside.drawer{animation:in .18s ease-out}@keyframes in{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>
<body>


<header>
  <div class="wrap top">
    <div class="brand">
      <small id="pSub">Тестовая версия</small>
      <h1 id="pName">Комплектатор</h1>
    </div>
    <div class="roles">
      <span>Смотреть как:</span>
      <div class="seg" id="roleSeg" role="group" aria-label="Роль"></div>
    </div>
  </div>
  <div class="wrap"><nav class="tabs" id="tabs" role="tablist"></nav></div>
</header>
<main class="wrap" id="main"></main>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Карточка позиции"></aside>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const ROLES={kompl:{name:"Комплектатор"},designer:{name:"Дизайнер"},client:{name:"Заказчик"}};
const ST={
  pick:{t:"Подбор",c:"--s-pick",owner:"kompl"},
  des:{t:"У дизайнера",c:"--s-des",owner:"designer"},
  cli:{t:"У заказчика",c:"--s-cli",owner:"client"},
  ok:{t:"Утверждено",c:"--s-ok",owner:"kompl"},
  ord:{t:"Заказано",c:"--s-ord",owner:"kompl"},
  del:{t:"Доставлено",c:"--s-del",owner:null}
};
const FLOW=["pick","des","cli","ok","ord","del"];
const ROOMS=["Гостиная","Кухня","Спальня","Ванная","Санузел","Прихожая","Детская","Кабинет","Гардеробная","Балкон"];
const allRooms=()=>[...new Set([...ROOMS,...(project.rooms||[]),...allItems.map(i=>i.room).filter(Boolean)])];
// Выпадающий список помещений с пунктом «Другое…» для нового помещения
const roomSelect=(id,cur,extra="")=>`<select id="${id}" class="roomsel"${extra}>${cur?"":`<option value="" selected disabled>— выберите —</option>`}${allRooms().map(r=>`<option${r===cur?" selected":""}>${esc(r)}</option>`).join("")}<option value="__new">＋ Другое помещение…</option></select>`;
// Разделы сметы, как в Excel: Отопление, Двери, Сантехника… Внутри раздела позиции идут по помещениям
const SECTIONS=["Отопление","Двери","Сантехника","Освещение","Электрика","Отделочные материалы","Мебель","Кухня и техника","Текстиль и декор","Прочее"];
const allSections=()=>[...new Set([...SECTIONS,...(project.sections||[]),...allItems.map(i=>i.section).filter(Boolean)])];
const sectionSelect=(id,cur,extra="")=>`<select id="${id}" class="roomsel"${extra}><option value=""${cur?"":" selected"}>— без раздела —</option>${allSections().map(r=>`<option${r===cur?" selected":""}>${esc(r)}</option>`).join("")}<option value="__new">＋ Другой раздел…</option></select>`;
function addSection(name){name=(name||"").trim();if(!name)return "";if(!allSections().includes(name)){project.sections=[...(project.sections||[]),name];saveProject()}return name}
function addRoom(name){name=(name||"").trim();if(!name)return "";if(!allRooms().includes(name)){project.rooms=[...(project.rooms||[]),name];saveProject()}return name}
const SWATCH=["#A8B5A2","#C4B49A","#8E9AA6","#B79C86","#D9D4CA","#7C6A58","#C8D0D2"];

let role=(()=>{const h=location.hash.slice(1);if(ROLES[h])return h;try{const r=localStorage.getItem("k-role");if(ROLES[r])return r}catch(e){}return"kompl"})();
let tab="overview",room="Все",openId=null,confirmDel=false;
const VIS_FEATURES=[["prices","Цены и бюджет"],["checklist","Чек-листы"],["payments","Счета и оплаты"],["delivery","Поставки"]];

function ldPrice(texts){
  let found=0;
  const walk=o=>{if(found||!o||typeof o!=="object")return;if(Array.isArray(o)){o.forEach(walk);return}
    const off=o.offers;if(off){const list=Array.isArray(off)?off:[off];for(const x of list){const n=toNum(x.price??x.lowPrice);if(n){found=n;return}}}
    Object.values(o).forEach(walk)};
  for(const t of [].concat(texts||[])){try{walk(JSON.parse(t))}catch(e){}if(found)break}
  return found;
}

// Сначала своя функция в Supabase (supabase/functions/preview), потом запасной сервис microlink.
async function fetchPreview(url){
  if(!/^https?:\/\//i.test(url||""))return {};
  if(/\.(jpe?g|png|webp|gif|avif)(\?|#|$)/i.test(url))return {img:url};
  const out={img:"",title:"",price:0};
  const merge=r=>{if(!out.img&&r.img)out.img=r.img;if(!out.title&&r.title)out.title=r.title;if(!out.price&&r.price)out.price=r.price};
  const done=()=>out.img&&out.price;
  if(SUPABASE_URL&&SUPABASE_KEY){
    try{
      const r=await fetch(SUPABASE_URL+"/functions/v1/preview?url="+encodeURIComponent(url),{headers:{apikey:SUPABASE_KEY}});
      if(r.ok){const j=await r.json();merge({img:j.image,title:j.title,price:toNum(j.price)})}
      else console.warn("preview function:",r.status);
    }catch(e){console.warn("preview function недоступна",e)}
  }
  if(done())return out;
  const base="https://api.microlink.io/?url="+encodeURIComponent(url);
  const rules="&data.price.selector="+encodeURIComponent('meta[property="product:price:amount"],meta[property="og:price:amount"],meta[itemprop="price"]')+"&data.price.attr=content"
    +"&data.ld.selectorAll="+encodeURIComponent('script[type="application/ld+json"]')+"&data.ld.attr=text";
  for(const q of [base+rules,base]){
    try{
      const j=await (await fetch(q)).json();
      if(j?.status==="success"){const d=j.data||{};merge({img:d.image?.url,title:d.title,price:toNum(d.price)||ldPrice(d.ld)});if(out.img)break}
      else console.warn("microlink:",j?.code||j?.status,j?.message);
    }catch(e){console.warn("microlink недоступен",e)}
  }
  if(!out.img)out.img=await shopGuess(url);
  return out;
}
function fileToDataUrl(file,max=480){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);res(c.toDataURL("image/jpeg",.8))};img.onerror=rej;img.src=URL.createObjectURL(file)})}

// Версия каждой позиции, какой её последний раз видели в базе. При сохранении
// отправляем только поля, изменённые здесь, поверх свежей версии из базы, чтобы
// не затереть то, что в это время поменял другой участник (например, помещение).
const base=new Map();
async function mergeWithServer(id,mine){
  const prevS=base.get(id);if(!prevS)return mine;
  const r=await sb.from("items").select("data").eq("id",id).maybeSingle();
  if(r.error||!r.data)return mine;
  const prev=JSON.parse(prevS),cur=r.data.data||{},out={...cur};
  for(const k of new Set([...Object.keys(prev),...Object.keys(mine)])){
    if(JSON.stringify(prev[k])===JSON.stringify(mine[k]))continue;
    if(k==="comments"){const seen=new Set((cur.comments||[]).map(c=>c.r+c.d+c.t));out.comments=[...(cur.comments||[]),...(mine.comments||[]).filter(c=>!seen.has(c.r+c.d+c.t))];continue}
    if(k in mine)out[k]=mine[k];else delete out[k];
  }
  return out;
}
async function save(it){
  if(!sb){render();return}
  const {id,_no,...body}=it;
  unsaved.set(id,it);
  for(let attempt=0;attempt<3;attempt++){
    const data=await mergeWithServer(id,JSON.parse(JSON.stringify(body)));
    const {error}=await sb.from("items").upsert({id,data,created:data.created||Date.now()});
    if(!error){
      base.set(id,JSON.stringify(data));
      if(unsaved.get(id)===it){unsaved.delete(id);if(JSON.stringify(data)!==JSON.stringify(body)){Object.assign(it,data);render()}}
      if(!unsaved.size&&saveErr){saveErr="";render()}backupLocal();return}
    console.error("save",id,error);saveErr=`«${it.name}» не сохранилась: ${error.message||error.code||"ошибка сети"}`;
    await new Promise(r=>setTimeout(r,800*(attempt+1)));
  }
  render();
}

function tri(i,compact){
  const after=s=>FLOW.indexOf(i.st)>=FLOW.indexOf(s);

  const c=!needC(i)?["не нужно","n"]:i.st==="cli"?["ждёт","w"]:after("ok")?["согласовал","g"]:i.sc==="rej"&&i.st==="pick"?["отклонил","r"]:["—","n"];

let bgLib=null;const cutting={};
async function imageBlob(src){
  if(src.startsWith("data:"))return (await fetch(src)).blob();
  try{const r=await fetch(src,{mode:"cors"});if(r.ok)return await r.blob()}catch(e){}
  if(SUPABASE_URL&&SUPABASE_KEY){const r=await fetch(SUPABASE_URL+"/functions/v1/preview?img="+encodeURIComponent(src),{headers:{apikey:SUPABASE_KEY}});if(r.ok&&(r.headers.get("content-type")||"").startsWith("image/"))return r.blob()}
  throw new Error("cors");
}
async function blobToAlphaDataUrl(blob,max=800){const bm=await createImageBitmap(blob);const k=Math.min(1,max/Math.max(bm.width,bm.height));const c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);const w=c.toDataURL("image/webp",.9);return w.startsWith("data:image/webp")?w:c.toDataURL("image/png")}
async function cutItem(it){
  if(cutting[it.id])return;cutting[it.id]="загружаю ИИ…";render();
  try{
    if(!bgLib)bgLib=await import("https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm");
    const blob=await imageBlob(it.img);
    cutting[it.id]="убираю фон…";render();
    const out=await bgLib.removeBackground(blob,{model:"isnet_fp16",output:{format:"image/png"},progress:(k,c,t)=>{const el=document.querySelector(`[data-cutstat="${it.id}"]`);if(el&&t)el.textContent=(k.startsWith("fetch")?"загружаю ИИ ":"убираю фон ")+Math.round(c/t*100)+"%"}});
    it.imgCut=await blobToAlphaDataUrl(out);delete cutting[it.id];save(it);toast("Фон убран: "+it.name);
  }catch(e){console.warn(e);delete cutting[it.id];toast(e.message==="cors"?"Магазин не даёт обработать это фото. Загрузите фото в карточке позиции файлом или через Ctrl+V и попробуйте снова.":"Не получилось убрать фон. Попробуйте ещё раз.")}

}

const SEC_WORDS=[[/отоплен|радиатор|конвектор/i,"Отопление"],[/^двер/i,"Двери"],[/сантех/i,"Сантехника"],[/освет|свет/i,"Освещение"],[/электр/i,"Электрика"],[/отдел|плитк|напольн/i,"Отделочные материалы"],[/мебел/i,"Мебель"],[/техник/i,"Кухня и техника"],[/текстил|декор/i,"Текстиль и декор"]];
const cap=t=>t?t[0].toUpperCase()+t.slice(1):t;
const normUnit=u=>{u=String(u||"").trim().toLowerCase().replace(/\.$/,"");if(!u)return "шт";if(/^м2|^м²|^кв/.test(u))return "м²";if(/пог|^м\.?п|^мп/.test(u))return "пог. м";if(/^компл|^к-т/.test(u))return "компл.";if(/^шт/.test(u))return "шт";return u};
// Разбирает смету: строки без цены и количества — это заголовки разделов или помещений, «ИТОГО…» пропускаются
function parseSheet(rows){
  const hi=rows.findIndex(r=>r.some(c=>/наимен/i.test(String(c))));if(hi<0)return [];
  const H=rows[hi].map(c=>String(c).toLowerCase());const col=re=>H.findIndex(h=>re.test(h));
  const C={name:col(/наимен/),dims:col(/габарит/),unit:col(/ед\.?\s*изм|^ед/),price:col(/цена/),qty:col(/кол/),total:col(/итог|стоимост/),color:col(/цвет/),ident:col(/идентиф/),url:col(/ссылк/),st:col(/статус/),note:col(/дополн|примеч|коммент/)};
  const g=(r,k)=>C[k]<0?"":String(r[C[k]]??"").trim();
  let section="",roomName="",groupIdent="",groupNote="";const out=[];
  for(const r of rows.slice(hi+1)){
    const name=g(r,"name");if(!name)continue;
    if(/^итого|^всего|стоимость за м/i.test(name))continue;
    const price=toNum(g(r,"price")),qty=toNum(g(r,"qty")),total=toNum(g(r,"total"));
    if(!g(r,"unit")&&!price&&!qty&&!total){
      const sw=SEC_WORDS.find(([re])=>re.test(name));
      if(sw&&!/^\d+\.|^д-\d/i.test(name)&&(/ведомость/i.test(name)||name.split(/\s+/).length<=3)){section=sw[1];roomName="";groupIdent="";groupNote="";continue}
      let t=name.replace(/^\d+[.)]\s*/,"");const par=(t.match(/\(([^)]*)\)/)||[])[1]||"";
      const id=(t.match(/^([А-ЯA-Z]{1,3}-\d+)/i)||[])[1];

      continue;
    }
    const st=/достав/i.test(g(r,"st"))?"del":/^заказ/i.test(g(r,"st"))?"ord":"pick";
    out.push({section,room:roomName||"Общее",name:name.slice(0,300),brand:"—",sku:"—",dims:g(r,"dims"),color:g(r,"color"),ident:g(r,"ident")||groupIdent,note:[groupNote,g(r,"note")].filter(Boolean).join("; "),url:/^https?:/i.test(g(r,"url"))?g(r,"url"):"",unit:normUnit(g(r,"unit")),qty:qty||1,price:price||(qty&&total?Math.round(total/qty*100)/100:0),st});
  }
  return out;
}

function groups(list){

  return secs;

  if(b.dataset.open&&e.target.closest("select,input"))return;

let drag=null;
document.addEventListener("pointerdown",e=>{
  const st=e.target.closest(".stage.editable");if(!st||!colEdit)return;
  const grip=e.target.closest("[data-grip]"),ly=e.target.closest("[data-layer]");if(!ly)return;
  e.preventDefault();const k=+ly.dataset.layer,l=colEdit.layers[k],r=st.getBoundingClientRect();
  if(colSel!==k){colSel=k;colEdit.title=$("#colTitle").value;render();}
  const el=document.querySelector(`.stage.editable [data-layer="${k}"]`);
  drag={k,el,r,mode:grip?"size":"move",sx:e.clientX,sy:e.clientY,ox:l.x,oy:l.y,ow:l.w};
});
document.addEventListener("pointermove",e=>{
  if(!drag)return;const l=colEdit.layers[drag.k],dx=(e.clientX-drag.sx)/drag.r.width*100,dy=(e.clientY-drag.sy)/drag.r.height*100;
  if(drag.mode==="move"){l.x=+(drag.ox+dx).toFixed(2);l.y=+(drag.oy+dy).toFixed(2);drag.el.style.left=l.x+"%";drag.el.style.top=l.y+"%"}
  else{l.w=Math.max(4,Math.min(150,+(drag.ow+dx).toFixed(2)));drag.el.style.width=l.w+"%"}
});
document.addEventListener("pointerup",()=>{drag=null});

  if(e.target.id==="xlsFile"&&e.target.files[0]){importXls(e.target.files[0]);e.target.value=""}
  if(e.target.id==="itemSup"){const it=byId(openId);it.sup=e.target.value.trim();save(it);toast("Поставщик сохранён");render()}
  if(e.target.id==="itemUrl"){const it=byId(openId);it.url=e.target.value.trim();if(it.url&&!it.sup)it.sup=shopName(it.url);save(it);if(it.url){toast("Ищу фото и цену на странице товара…");fetchPreview(it.url).then(r=>{const got=[];if(r.img&&!it.img){it.img=r.img;got.push("фото")}if(r.price&&!it.price){it.price=r.price;got.push("цена")}if(got.length){save(it);toast("Добавлено: "+got.join(" и "));render()}else if(!it.img||!it.price)toast("Не всё нашлось на странице. Укажите вручную.")})}render()}
  if(e.target.id==="itemBoxes"){const it=byId(openId);const b=Math.max(0,Math.round(+e.target.value||0));if(+it.perPack>0&&b){it.area=+(b*it.perPack).toFixed(3);recalc(it);save(it);render()}else toast("Сначала укажите, сколько в коробке")}
  if(["itemUnit","itemQty","itemPack"].includes(e.target.id)){const it=byId(openId);it.unit=$("#itemUnit").value;const q=+$("#itemQty").value||0;if(isArea(it.unit)){it.area=q;it.perPack=+($("#itemPack")?.value)||0}else{it.qty=q;it.area=0;it.perPack=0}recalc(it);save(it);render()}
  if(e.target.id==="fUnit")e.target.dataset.touched="1";
  if(["fUnit","fQty","fPack"].includes(e.target.id))updatePackCalc();
  if(["itemPrice","itemCPrice","itemBPrice","itemDeliv"].includes(e.target.id)){const it=byId(openId);it.price=+$("#itemPrice").value||0;it.clientPrice=+$("#itemCPrice").value||0;it.bureauPrice=+$("#itemBPrice").value||0;it.delivery=+$("#itemDeliv").value||0;save(it);toast("Цена сохранена");render()}
  if(e.target.id==="needClient"){const it=byId(openId);it.needClient=e.target.checked;toast(needC(it)?"Позиция пойдёт на согласование заказчику":"Заказчику согласовывать не нужно");save(it);render()}
  if(e.target.dataset.vis){const[r,f]=e.target.dataset.vis.split(":");const v=structuredClone(project.vis||VIS_DEFAULT);v[r]={...v[r],[f]:e.target.checked};project.vis=v;saveProject();toast(`${ROLES[r].name}: «${VIS_FEATURES.find(x=>x[0]===f)[1]}» ${e.target.checked?"видно":"скрыто"}`);render()}
  if(e.target.dataset.cl!==undefined){const it=byId(openId);it.checklist[+e.target.dataset.cl].done=e.target.checked;save(it);render()}
  if(e.target.id==="showClient"){const it=byId(openId);it.hideClient=!e.target.checked;save(it);toast(it.hideClient?"Позиция скрыта от заказчика":"Заказчик видит позицию");render()}
  if(["payStatus","payInvoice","payPaid"].includes(e.target.id)){const it=byId(openId);it.pay={status:$("#payStatus").value,invoice:+$("#payInvoice").value||0,paid:+$("#payPaid").value||0};if(it.pay.paid&&it.pay.invoice&&it.pay.paid>=it.pay.invoice){it.pay.status="paid";}save(it);toast("Оплата сохранена");render()}
  if(e.target.id==="etaInput"){const it=byId(openId);it.eta=e.target.value;save(it);toast("Дата поставки сохранена");render()}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  const id=e.target.id;
  if(e.target.dataset.ans){saveAnswer(e.target);return}
  if(id==="supForm"){createSupReq();return}
  if(id==="compose"){const t=$("#cText").value.trim();if(!t)return;const it=byId(openId);it.comments=[...(it.comments||[]),{r:role,t,d:now()}];$("#cText").value="";save(it);render();$("#cText")?.focus()}
  if(id==="clForm"){const t=$("#clText").value.trim();if(!t)return;const it=byId(openId);it.checklist=[...(it.checklist||[]),{t,done:false}];save(it);render();$("#clText")?.focus()}
  if(id==="varForm"){
    const it=byId(openId),n=$("#vName").value.trim();if(!n)return;
    const V=it.variants||[];
    if(!V.length)V.push({name:it.name,brand:it.brand,sku:it.sku,price:it.price,clientPrice:it.clientPrice||0,sw:it.sw,url:it.url||"",img:it.img||""});
    const nv={name:n,brand:$("#vBrand").value.trim()||"—",sku:"—",price:+$("#vPrice").value||0,sw:SWATCH[V.length%SWATCH.length],url:$("#vUrl").value.trim(),img:""};V.push(nv);
    if(nv.url)fetchPreview(nv.url).then(r=>{let ch=false;if(r.img){nv.img=r.img;ch=true}if(r.price&&!nv.price){nv.price=r.price;ch=true}if(ch){save(it);render()}});
    it.variants=V;if(it.chosen==null)it.chosen=0;
    toast("Вариант добавлен");save(it);render();
  }
  if(id==="vizForm"){
    if(!vizPending){toast("Сначала выберите картинку");return}
    const v={id:"viz-"+newId(),created:Date.now(),title:$("#vzTitle").value.trim()||"Визуализация",room:$("#vzRoom").value,img:vizPending,pins:[]};
    vizPending="";vizList.push(v);pinMode=v.id;saveViz(v);toast("Визуализация добавлена. Кликните по картинке, чтобы поставить метку");render();
  }
  if(id==="projForm"){
    project={...project,name:$("#pjName").value.trim()||"Новый проект",address:$("#pjAddr").value.trim(),budget:+$("#pjBudget").value||0,area:+$("#pjArea").value||0};
    toast("Данные проекта сохранены");saveProject();render();
  }
  if(id==="addForm"){
    const sec=$("#fSection").value==="__new"?addSection($("#fSectionNew").value):$("#fSection").value;secPick=sec;
    const it={id:newId(),created:Date.now(),section:sec,dims:$("#fDims").value.trim(),color:$("#fColor").value.trim(),ident:$("#fIdent").value.trim(),note:$("#fNote").value.trim(),room:$("#fRoom").value==="__new"?addRoom($("#fRoomNew").value):$("#fRoom").value,name:$("#fName").value.trim(),brand:$("#fBrand").value.trim()||"—",sku:$("#fSku").value.trim()||"—",sup:$("#fSup").value.trim()||shopName($("#fUrl").value.trim()),url:$("#fUrl").value.trim(),img:pendingImg,qty:Math.max(0,+$("#fQty").value||1),unit:$("#fUnit").value,area:isArea($("#fUnit").value)?+$("#fQty").value||0:0,perPack:isArea($("#fUnit").value)?+$("#fPack").value||0:0,price:+$("#fPrice").value||0,clientPrice:+$("#fCPrice").value||0,bureauPrice:+$("#fBPrice").value||0,delivery:+$("#fDeliv").value||0,sw:SWATCH[items.length%SWATCH.length],st:"pick",comments:[],needClient:$("#fNeed").checked,variants:[],chosen:0,checklist:[],pay:{status:"none",invoice:0,paid:0}};
    recalc(it);allItems.push(it);pendingImg="";e.target.reset();
    if((!it.img||!it.price)&&it.url)fetchPreview(it.url).then(r=>{let ch=false;if(r.img&&!it.img){it.img=r.img;ch=true}if(r.price&&!it.price){it.price=r.price;ch=true}if(ch){save(it);render()}});e.target.hidden=true;
    toast("Позиция добавлена в подбор");save(it);render();
  }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&openId){openId=null;confirmDel=false;renderDrawer()}});
window.addEventListener("hashchange",()=>{if(/^#sup=/.test(location.hash)!==!!SUP_TOKEN){location.reload();return}const h=location.hash.slice(1);if(ROLES[h]){role=h;render()}});
render();
connect();
</script>
